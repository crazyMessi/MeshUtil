<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>非法输入：2 条矛盾边，代表 0x91</title><rect width="100%" height="100%" fill="#f6f8fb"/><g font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif"><text x="20" y="31" font-size="24" fill="#20364e" font-weight="700">2 条矛盾边 / 60 个编码</text><text x="978" y="30" font-size="17" fill="#c53d42" text-anchor="end">代表输入 0x91</text><text x="20" y="58" font-size="15" fill="#61778c" >矛盾条件：端点异号，但 pair bit=1 要求两次穿越。每次穿越都会翻转内外。</text><rect x="18" y="80" width="270" height="340" rx="12" fill="white" stroke="#dce5ee"/><rect x="300" y="80" width="256" height="340" rx="12" fill="white" stroke="#dce5ee"/><rect x="570" y="80" width="412" height="340" rx="12" fill="white" stroke="#dce5ee"/><text x="36" y="107" font-size="16" fill="#20364e" font-weight="700">① 立方体中的位置</text><polygon points="51.88,260.24 179.88,260.24 254.12,303.76 126.12,303.76" fill="#e7f0f8" stroke="none"/><line x1="51.88" y1="260.24" x2="179.88" y2="260.24" stroke="#b8c7d4" stroke-width="1.3" /><line x1="126.12" y1="303.76" x2="254.12" y2="303.76" stroke="#b8c7d4" stroke-width="1.3" /><line x1="51.88" y1="132.24" x2="179.88" y2="132.24" stroke="#b8c7d4" stroke-width="1.3" /><line x1="126.12" y1="175.76" x2="254.12" y2="175.76" stroke="#b8c7d4" stroke-width="1.3" /><line x1="51.88" y1="260.24" x2="126.12" y2="303.76" stroke="#b8c7d4" stroke-width="1.3" /><line x1="179.88" y1="260.24" x2="254.12" y2="303.76" stroke="#b8c7d4" stroke-width="1.3" /><line x1="51.88" y1="132.24" x2="126.12" y2="175.76" stroke="#b8c7d4" stroke-width="1.3" /><line x1="179.88" y1="132.24" x2="254.12" y2="175.76" stroke="#b8c7d4" stroke-width="1.3" /><line x1="51.88" y1="260.24" x2="51.88" y2="132.24" stroke="#b8c7d4" stroke-width="1.3" /><line x1="179.88" y1="260.24" x2="179.88" y2="132.24" stroke="#b8c7d4" stroke-width="1.3" /><line x1="126.12" y1="303.76" x2="126.12" y2="175.76" stroke="#b8c7d4" stroke-width="1.3" /><line x1="254.12" y1="303.76" x2=