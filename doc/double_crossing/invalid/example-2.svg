20364e" text-anchor="start">c2</text><circle cx="355.00" cy="159.00" r="5.00" fill="white" stroke="#20364e" stroke-width="1.4" data-kind="corner" data-corner="3"/><text x="346" y="148" font-size="11" fill="#20364e" text-anchor="end">c3</text><text x="318" y="366" font-size="12" fill="#c53d42" >矛盾边：e0, e3</text><text x="318" y="391" font-size="12" fill="#61778c" >请求交点数：[2, 0, 0, 2]</text><text x="588" y="107" font-size="16" fill="#20364e" font-weight="700">③ 放大 e0：c0 → c1</text><text x="590" y="144" font-size="13" fill="#61778c" >沿箭头方向走，两次穿越后回到原符号：</text><line x1="616.00" y1="186.00" x2="936.00" y2="186.00" stroke="#20364e" stroke-width="1.7" /><line x1="860.00" y1="186.00" x2="906.00" y2="186.00" stroke="#20364e" stroke-width="1.7" /><polyline points="901.00,188.25 906.00,186.00 901.00,183.75" fill="none" stroke="#20364e" stroke-width="1.7"/><circle cx="616.00" cy="186.00" r="7.00" fill="#20364e" stroke="#20364e" stroke-width="1.4" /><circle cx="718.00" cy="186.00" r="4.00" fill="white" stroke="#c53d42" stroke-width="1.8" /><circle cx="820.00" cy="186.00" r="4.00" fill="white" stroke="#c53d42" stroke-width="1.8" /><circle cx="936.00" cy="186.00" r="7.00" fill="#20364e" stroke="#20364e" stroke-width="1.4" /><text x="616" y="217" font-size="12" fill="#20364e" text-anchor="middle">起点：内</text><text x="616" y="240" font-size="12" fill="#61778c" text-anchor="middle">c0</text><text x="718" y="217" font-size="12" fill="#20364e" text-anchor="middle">第 1 次</text><text x="718" y="240" font-size="12" fill="#61778c" text-anchor="middle">变成外</text><text x="820" y="217" font-size="12" fill="#20364e" text-anchor="middle">第 2 次</text><text x="820" y="240" font-size="12" fill="#61778c" text-anchor="middle">变回内</text><text x="936" y="217" font-size="12" fill="#20364e" text-anchor="middle">应当：内</text><text x="936" y="240" font-size="12" fill="#61778c" text-anchor="middle">终点</text><line x1="590.00" y1="269.00" x2="962.00" y2="269.00" stroke="#e1e8ef" stroke-width="1" /><text x="590" y="299" font-size="14" fill="#20364e" >但编码给定的终点是：</text><circle cx="825.00" cy="294.00" r="8.00" fill="white" stroke="#c53d42" stroke-width="2" /><text x="844" y="300" font-size="18" fill="#c53d42" font-weight="700">外</text><text x="590" y="339" font-size="15" fill="#c53d42" font-weight="700">应当为内，却写成外 → 输入自相矛盾</text><text x="590" y="371" font-size="13" fill="#61778c" >此输入不生成连接线、闭环或曲面。</text><text x="590" y="394" font-size="13" fill="#61778c" >API：std::invalid_argument</text><text x="20" y="448" font-size="12" fill="#61778c" >实心角点=内；空心角点=外；小圆=请求交点；红色=矛盾边。局部 c0,c1,c2,c3 对应立方体顶点 0,1,3,2。</text></g></svg>
