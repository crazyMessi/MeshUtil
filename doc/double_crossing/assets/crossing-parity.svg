<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Valid and rejected double-crossing labels on a cubic grid cell</title>
  <desc id="description">Two views show identical cubic cells intersected by a thin solid slab. Two parallel planes bound the blue interior, and all eight true cube corners lie outside it. On the highlighted front edge, A is outside, p0 enters the slab, and p1 exits it, so B must be outside. The left cube labels B correctly. The right cube deliberately supplies an inside label at B, shown in red and rejected because two crossings require the endpoint signs to match.</desc>
  <rect width="960" height="540" fill="#ffffff"/>
  <defs>
    <!-- Oblique projection: (x, y, z) -> (95 + 200x + 100y, 425 - 85y - 200z).
         The cube is [0,1]^3; the solid slab is 0.33 <= x <= 0.67.
         Every plane vertex is an exact plane/cube-edge intersection. -->
    <g id="cube-geometry">
      <!-- The three hidden edges meet at the rear lower left corner. -->
      <path d="M 95 425 L 195 340 L 395 340 M 195 340 L 195 140" fill="none" stroke="#97a3b1" stroke-width="1.5" stroke-dasharray="5 5"/>

      <!-- Slab surfaces on the rear, bottom, top, and front cube faces. -->
      <path d="M 261 140 H 329 V 340 H 261 Z" fill="#327bb8" fill-opacity="0.08"/>
      <path d="M 161 425 H 229 L 329 340 H 261 Z" fill="#327bb8" fill-opacity="0.08"/>
      <path d="M 161 225 H 229 L 329 140 H 261 Z" fill="#327bb8" fill-opacity="0.16"/>
      <path d="M 161 225 H 229 V 425 H 161 Z" fill="#327bb8" fill-opacity="0.14"/>

      <!-- The two parallel slab-boundary planes, clipped exactly to the cell. -->
      <path d="M 229 425 V 225 L 329 140 V 340 Z" fill="#327bb8" fill-opacity="0.11" stroke="#598cb5" stroke-width="1.3"/>
      <path d="M 161 425 V 225 L 261 140 V 340 Z" fill="#327bb8" fill-opacity="0.11" stroke="#598cb5" stroke-width="1.3"/>

      <!-- Nine visible cube edges; together with the three hidden edges, 12. -->
      <path d="M 95 425 V 225 H 295 V 425 Z M 95 225 L 195 140 H 395 V 340 L 295 425 M 295 225 L 395 140" fill="none" stroke="#4b596a" stroke-width="2" stroke-linejoin="round"/>

      <!-- Front edge A -> B: outside, inside, outside. -->
      <path d="M 95 425 H 161 M 229 425 H 295" fill="none" stroke="#17212e" stroke-width="3.5"/>
      <path d="M 161 425 H 229" fill="none" stroke="#1767a5" stroke-width="4.5"/>
      <path d="M 281 420 L 288 425 L 281 430" fill="none" stroke="#17212e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Seven outside corner markers. B is supplied separately in each view. -->
      <g fill="#ffffff" stroke="#334154" stroke-width="1.8">
        <circle cx="95" cy="425" r="5.5"/>
        <circle cx="95" cy="225" r="5.5"/>
        <circle cx="295" cy="225" r="5.5"/>
        <circle cx="195" cy="340" r="5.5"/>
        <circle cx="395" cy="340" r="5.5"/>
        <circle cx="195" cy="140" r="5.5"/>
        <circle cx="395" cy="140" r="5.5"/>
      </g>
      <g fill="#1767a5" stroke="#ffffff" stroke-width="1.3">
        <circle cx="161" cy="425" r="5.5"/>
        <circle cx="229" cy="425" r="5.5"/>
      </g>
      <path d="M 161 434 V 460 M 229 434 V 460" fill="none" stroke="#598cb5" stroke-width="1.2"/>
    </g>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#17212e">
    <text x="32" y="36" font-size="24" font-weight="700">Two crossings in one cube cell</text>
    <rect x="33" y="56" width="14" height="14" rx="2" fill="#c8dfef" stroke="#598cb5"/>
    <text x="56" y="69" font-size="15">Blue region: inside</text>
    <circle cx="251" cy="63" r="5.5" fill="#ffffff" stroke="#334154" stroke-width="1.8"/>
    <text x="266" y="69" font-size="15">Hollow corners: outside</text>
    <text x="473" y="69" font-size="15">Two parallel planes bound the slab.</text>
    <path d="M 480 95 V 512" fill="none" stroke="#e0e5eb"/>

    <text x="245" y="108" font-size="19" font-weight="700" text-anchor="middle">Valid labels</text>
    <use href="#cube-geometry"/>
    <circle cx="295" cy="425" r="5.5" fill="#ffffff" stroke="#334154" stroke-width="1.8"/>
    <g font-size="15" text-anchor="middle">
      <text x="95" y="451">A: outside</text>
      <text x="295" y="451">B: outside</text>
      <text x="161" y="480" fill="#175b91">p₀: enter</text>
      <text x="229" y="480" fill="#175b91">p₁: exit</text>
    </g>

    <text x="715" y="108" font-size="19" font-weight="700" text-anchor="middle">Rejected labels</text>
    <use href="#cube-geometry" transform="translate(470 0)"/>
    <circle cx="765" cy="425" r="6.5" fill="#1767a5" stroke="#b42318" stroke-width="2.5"/>
    <g font-size="15" text-anchor="middle">
      <text x="565" y="451">A: outside</text>
      <text x="765" y="451" fill="#b42318" font-weight="700">B: inside</text>
      <text x="631" y="480" fill="#175b91">p₀: enter</text>
      <text x="699" y="480" fill="#175b91">p₁: exit</text>
      <text x="807" y="476" fill="#b42318">(incorrect input)</text>
      <text x="807" y="501" fill="#b42318" font-weight="700">Required: outside</text>
    </g>

    <text x="480" y="528" font-size="14" fill="#4b596a" text-anchor="middle">Identical geometry in both views; only the supplied sign at B differs.</text>
  </g>
</svg>
